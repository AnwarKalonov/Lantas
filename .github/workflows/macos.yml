name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASES_REPO: AnwarKalonov/Lantas-download
  # Set these under Settings → Secrets and variables → Actions.
  # Without the signing key the app still builds; it just cannot update itself.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  # Classic PAT with `contents: write` on RELEASES_REPO, to publish the release.
  LANTAS_RELEASE_TOKEN: ${{ secrets.LANTAS_RELEASE_TOKEN }}
  # Apple Developer ID signing is optional. When all six secrets below are
  # present, the build is signed, notarized and stapled; otherwise it stays
  # ad-hoc signed and macOS will warn on first launch. The workflow exports
  # them only after checking all six are present.
  #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
  #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID

jobs:
  macos:
    # macos-latest runs on Apple Silicon; use macos-13 for an Intel build.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A secret pasted from a terminal often carries a trailing newline, and the
      # bundler base64-decodes the value as-is. Normalise it once for every step.
      - name: Clean the signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          KEY="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')"
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty after trimming"
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"
          # Say what arrived. A private key is ~348 chars and its decoded header
          # is `untrusted comment: rsign encrypted secret key`; a public key is
          # ~152 and says `minisign public key`.
          node -e '
            const key = process.env.TAURI_SIGNING_PRIVATE_KEY || "";
            const header = Buffer.from(key, "base64").toString("utf8").split("\n")[0] || "";
            console.log(`signing key: ${key.length} chars`);
            console.log(`decoded header: ${JSON.stringify(header.slice(0, 44))}`);
            if (!header.includes("rsign encrypted secret key")) {
              console.error("::error::TAURI_SIGNING_PRIVATE_KEY is not a Tauri private key. Copy ~/.tauri/lantas.key, not the .pub file.");
              process.exit(1);
            }
          '

      # Fail in seconds rather than after a full build when the stored key is
      # stale, password-protected, or belongs to a different keypair.
      - name: Check the signing key works
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          printf 'lantas signing check\n' > "$RUNNER_TEMP/probe.txt"
          npx tauri signer sign --app-version 0 "$RUNNER_TEMP/probe.txt" > /dev/null
          echo "signing key works"

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the version in src-tauri/tauri.conf.json (${VERSION})"
            exit 1
          fi

      # Export the Apple credentials only when they are complete. Exporting an
      # empty APPLE_SIGNING_IDENTITY would override the ad-hoc identity in
      # tauri.conf.json and break the unsigned build.
      - name: Configure Apple signing
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_VALUE: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$SIGNING_IDENTITY" ] && [ -z "$CERTIFICATE" ]; then
            echo "No Apple Developer ID secrets; this build will be ad-hoc signed."
            exit 0
          fi

          SIGNING_IDENTITY="$(printf '%s' "$SIGNING_IDENTITY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          CERTIFICATE="$(printf '%s' "$CERTIFICATE" | tr -d '[:space:]')"
          APPLE_ID_VALUE="$(printf '%s' "$APPLE_ID_VALUE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          TEAM_ID="$(printf '%s' "$TEAM_ID" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          missing=0
          check() {
            if [ -z "$2" ]; then
              echo "::error::$1 must be set for a notarized build"
              missing=1
            fi
          }
          check APPLE_SIGNING_IDENTITY "$SIGNING_IDENTITY"
          check APPLE_CERTIFICATE "$CERTIFICATE"
          check APPLE_CERTIFICATE_PASSWORD "$CERTIFICATE_PASSWORD"
          check APPLE_ID "$APPLE_ID_VALUE"
          check APPLE_PASSWORD "$APPLE_PASSWORD_VALUE"
          check APPLE_TEAM_ID "$TEAM_ID"
          [ "$missing" = 0 ] || exit 1

          {
            printf 'APPLE_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY"
            printf 'APPLE_CERTIFICATE=%s\n' "$CERTIFICATE"
            printf 'APPLE_CERTIFICATE_PASSWORD=%s\n' "$CERTIFICATE_PASSWORD"
            printf 'APPLE_ID=%s\n' "$APPLE_ID_VALUE"
            printf 'APPLE_PASSWORD=%s\n' "$APPLE_PASSWORD_VALUE"
            printf 'APPLE_TEAM_ID=%s\n' "$TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "::notice::Developer ID signing, notarization and stapling are enabled."

      - name: Import the Developer ID certificate
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/lantas-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          openssl base64 -d -A -in <(printf '%s' "$APPLE_CERTIFICATE") -out "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$APPLE_SIGNING_IDENTITY"
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Enable hardened runtime
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const file = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(file, "utf8"));
          config.bundle.macOS.hardenedRuntime = true;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          console.log("hardenedRuntime enabled for notarization");
          NODE

      - name: Build app
        # Tauri passes --skip-jenkins to create-dmg whenever CI=true, which
        # strips the background and icon layout. GitHub's macOS runners do have
        # a Finder session, so keep the designed DMG window for release builds.
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          CONFIG=()
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            # The overlay adds bundle.createUpdaterArtifacts, so the build emits
            # the .app.tar.gz and its signature.
            CONFIG=(--config src-tauri/tauri.updater.json)
          fi
          npm run tauri build -- "${CONFIG[@]}"

      # The extension is a bundle resource and the app is ad-hoc signed by the
      # bundler (signingIdentity in tauri.conf.json), so the copy inside the dmg
      # is signed too. Editing the app after this point would break that seal.
      - name: Check the app is signed
        run: |
          APP="src-tauri/target/release/bundle/macos/Lantas.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|Authority|TeamIdentifier"
          test -f "$APP/Contents/Resources/chrome-extension/manifest.json"
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            spctl --assess --type execute --verbose=4 "$APP"
            xcrun stapler validate "$APP"
          fi

      # The Finder layout is part of the product. Fail the build when the dmg
      # is a plain window instead of the branded drag-to-Applications surface.
      - name: Verify the dmg Finder layout
        run: |
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          MOUNT="$RUNNER_TEMP/lantas-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          echo "Mounted dmg contents:"
          ls -la "$MOUNT"
          echo ".background contents:"
          ls -la "$MOUNT/.background" 2>/dev/null || true
          test -f "$MOUNT/.background/background.png"
          test -f "$MOUNT/.DS_Store"
          test -f "$MOUNT/Lantas.app/Contents/MacOS/Lantas"
          test -d "$MOUNT/Applications"
          echo "dmg Finder layout verified: custom background, icon positions and Applications link"
          hdiutil detach "$MOUNT" -quiet
          trap - EXIT

      - name: Package release assets
        run: bash scripts/package-release.sh

      # Tauri notarizes and staples the .app. The dmg is a container around
      # that stapled app; validating the app is the check that matches what
      # Gatekeeper sees on first launch.
      - name: Check notarization
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          APP="src-tauri/target/release/bundle/macos/Lantas.app"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Lantas-macOS
          path: release-assets/*
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') && env.LANTAS_RELEASE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.LANTAS_RELEASE_TOKEN }}
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          FILES=(release-assets/*)
          NOTES=(--notes "Lantas ${VERSION}")
          if [ -f RELEASE_NOTES.md ]; then NOTES=(--notes-file RELEASE_NOTES.md); fi

          if gh release view "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --repo "$RELEASES_REPO" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --repo "$RELEASES_REPO" \
              --title "Lantas ${VERSION}" \
              "${NOTES[@]}" \
              --latest
          fi

      - name: Say how to finish by hand
        if: startsWith(github.ref, 'refs/tags/v') && env.LANTAS_RELEASE_TOKEN == ''
        run: |
          echo "::notice title=Release not published::Add LANTAS_RELEASE_TOKEN to publish automatically, or download the Lantas-macOS artifact and attach its files to a release tagged $GITHUB_REF_NAME in $RELEASES_REPO."
