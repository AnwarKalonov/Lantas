[package]
name = "lantas"
version = "0.1.0"
description = "Lantas desktop"
authors = ["Lantas"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lantas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"
